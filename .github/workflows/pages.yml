name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Public client URL of the production Convex deployment (not a secret).
      VITE_CONVEX_URL: https://limitless-kiwi-576.ap-southeast-2.convex.cloud
      VITE_BASE: /setstamp/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Not `npm ci`: npm drops @emnapi/* (deps of the optional wasm32 bindings of rolldown and
      # tailwind oxide) from the lockfile, and `npm ci` then refuses it as out of sync.
      # package.json pins exact versions, so `npm install` resolves the same direct deps.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
