<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Setstamp: a free lifting log that works offline</title>
    <meta
      name="description"
      content="A free lifting log that works offline. No limits on history or programs, 1,383 searchable exercises, muscle coverage charts and data export."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Setstamp" />
    <meta property="og:title" content="Setstamp: a free lifting log that works offline" />
    <meta property="og:url" content="https://koala3353.github.io/setstamp/" />
    <meta property="og:image" content="https://koala3353.github.io/setstamp/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Setstamp" />
    <meta
      property="og:description"
      content="A free lifting log for your phone. It works offline, keeps your full history and has no subscription."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Setstamp: a free lifting log that works offline" />
    <meta name="twitter:image" content="https://koala3353.github.io/setstamp/og.png" />
    <meta name="twitter:description" content="A free lifting log for your phone. It works offline and keeps your full history." />
    <meta name="theme-color" content="#ebe9e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Setstamp" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/big-shoulders-stencil-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme before first paint (no flash). "system" = no attribute.
      (function () {
        try {
          var t = localStorage.getItem("gym.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Setstamp needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
